[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-tfidf-vectorizer-cosine-similarity-skill"
version = "1.0.0"
description = "TF-IDF sublinear vectorizer with smooth inverse document frequency and pairwise cosine similarity."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-tfidf-vectorizer-cosine-similarity-skill"
Repository = "https://github.com/alphaparkinc/genpark-tfidf-vectorizer-cosine-similarity-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-tfidf-vectorizer-cosine-similarity-skill/issues"
